<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>英打遊戲開發歷程</title>
<style>
body{font-family:system-ui,"Microsoft JhengHei",sans-serif;margin:0;background:#f5f3ec;color:#243e38}
main{max-width:1000px;margin:auto;padding:50px 20px}
h1{text-align:center;margin-bottom:35px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{background:white;border:1px solid #ccd7ce;border-radius:18px;padding:25px;display:flex;flex-direction:column;min-height:200px}
.card p{flex:1;color:#526459}
a.button{display:inline-block;text-align:center;padding:12px 18px;background:#426d5e;color:white;text-decoration:none;border-radius:10px}
@media(max-width:700px){.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<h1>英打遊戲開發歷程</h1>
<div class="cards">

<section class="card">
<h2>版本一</h2>
<p>英打遊戲的第一個版本：標題與開始按鈕。</p>
<a class="button" href="https://yuanyu115.github.io/typing-v1/" target="_blank" rel="noopener">開啟版本一</a>
</section>

<section class="card">
<h2>版本二</h2>
<p>加入英文鍵盤圖片與嗶嗶聲音效。</p>
<a class="button" href="https://yuanyu115.github.io/typing-v2/" target="_blank" rel="noopener">開啟版本二</a>
</section>

<section class="card">
<h2>版本三</h2>
<p>練習左手 A、S、D、F，按對字母就能得分。</p>
<a class="button" href="v3/index.html">開啟版本三</a>
</section>

</div>
</main>
</body>
</html>
